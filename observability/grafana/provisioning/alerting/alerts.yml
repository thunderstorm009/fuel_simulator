apiVersion: 1
groups:
  - orgId: 1
    name: Fuel Supply Platform
    folder: Fuel Supply Platform
    interval: 1m
    rules:
      - uid: snapshot-age-high
        title: Snapshot age over 30 seconds
        condition: A
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model: {expr: "snapshot_age_seconds > 30", instant: true, refId: A, datasource: {type: prometheus, uid: prometheus}, intervalMs: 1000, maxDataPoints: 43200}
        noDataState: NoData
        execErrState: Error
        for: 1m
        annotations: {summary: "The latest accepted simulator snapshot is older than 30 seconds."}
        labels: {severity: warning}
      - uid: simulator-breaker-open
        title: Simulator circuit breaker open
        condition: A
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model: {expr: "sim_breaker_state{state=\"OPEN\"} == 1", instant: true, refId: A, datasource: {type: prometheus, uid: prometheus}, intervalMs: 1000, maxDataPoints: 43200}
        noDataState: NoData
        execErrState: Error
        for: 1m
        annotations: {summary: "The worker simulator client breaker is open."}
        labels: {severity: critical}
      - uid: api-5xx-rate-high
        title: API 5xx rate high
        condition: A
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model: {expr: "sum(rate(http_requests_total{status_class=\"5xx\"}[5m])) > 1", instant: true, refId: A, datasource: {type: prometheus, uid: prometheus}, intervalMs: 1000, maxDataPoints: 43200}
        noDataState: NoData
        execErrState: Error
        for: 2m
        annotations: {summary: "The API is returning more than one 5xx response per second."}
        labels: {severity: warning}
      - uid: predictor-fallback-active
        title: Predictor fallback active
        condition: A
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model: {expr: "increase(policy_fallback_total[5m]) > 0", instant: true, refId: A, datasource: {type: prometheus, uid: prometheus}, intervalMs: 1000, maxDataPoints: 43200}
        noDataState: NoData
        execErrState: Error
        for: 0s
        annotations: {summary: "A forecast or policy used its fallback path in the last five minutes."}
        labels: {severity: warning}
