global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alert_rules.yml

scrape_configs:
  - job_name: api
    static_configs:
      - targets: [api:8101]
  - job_name: worker
    static_configs:
      - targets: [worker:8102]
  - job_name: predictor
    static_configs:
      - targets: [predictor:8103]
