global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: api
    static_configs:
      - targets: [api:8101]
  - job_name: worker
    static_configs:
      - targets: [worker:8102]
  - job_name: predictor
    static_configs:
      - targets: [predictor:8103]
