name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm --prefix web run test
      - run: npm --prefix web run typecheck
      - run: npm --prefix web run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Validate Compose model
        run: docker compose config -q
      - name: Build and start stack
        run: |
          docker compose up --build -d
          for service in simulator postgres api worker predictor frontend prometheus grafana; do
            for _ in $(seq 1 60); do
              state="$(docker compose ps --format json "$service" | python3 -c 'import json,sys; rows=[json.loads(x) for x in sys.stdin if x.strip()]; print(rows[0].get("Health", "") if rows else "")')"
              [ "$state" = healthy ] && break
              sleep 2
            done
            [ "$state" = healthy ] || { echo "$service did not become healthy"; exit 1; }
          done
          curl --fail --silent --show-error http://localhost:8101/api/health
      - name: Run scenario runner smoke
        run: |
          pip install -r requirements-dev.txt pyyaml
          python3 scripts/scenario_runner.py --scenario baseline --policy heuristic --ticks 5
      - name: Save Compose logs on failure
        if: failure()
        run: docker compose logs --no-color > compose-failure.log
      - uses: actions/upload-artifact@v4.6.2
        if: failure()
        with:
          name: compose-failure-logs
          path: compose-failure.log
      - name: Stop stack
        if: always()
        run: docker compose down -v

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - name: Python Dependency Audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt -r requirements-dev.txt || true
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22"
      - name: NPM Dependency Audit
        run: npm audit --prefix web --audit-level=high
