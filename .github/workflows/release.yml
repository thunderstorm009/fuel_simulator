name: release

on:
  push:
    tags:
      - "v*"
      - "sprint-*"

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push api image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: backend/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository }}/api:${{ steps.meta.outputs.sha }}

      - name: Build and push worker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: backend/worker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/worker:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository }}/worker:${{ steps.meta.outputs.sha }}

      - name: Build and push predictor image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: intel/predictor/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/predictor:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository }}/predictor:${{ steps.meta.outputs.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v7.4.0
        with:
          context: web
          file: web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository }}/frontend:${{ steps.meta.outputs.sha }}

  deploy-gate:
    needs: build-and-publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Validate Compose model
        run: docker compose config -q
      - name: Start stack and verify health
        run: |
          docker compose up --build -d
          bash scripts/smoke.sh
      - name: Stop stack
        if: always()
        run: docker compose down -v
